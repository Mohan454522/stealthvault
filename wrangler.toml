name = "stealthvault"
compatibility_date = "2024-09-02"
compatibility_flags = ["nodejs_compat"]

# Serve all static files (HTML, CSS, JS) from this folder
[assets]
directory = "./"
not_found_handling = "single-page-application"

# Production environment (main branch → vaults.codes)
[env.production]
name = "stealthvault"

# Dev/staging environment (dev branch → dev.vaults.codes)
[env.dev]
name = "stealthvault-dev"
